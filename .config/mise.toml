min_version = "2026.11.8"

[settings]
minimum_release_age = "7d"

[tasks."docs:build"]
description = "Build the documentation site"
run = "zensical build"

[tasks."docs:serve"]
description = "Serve the documentation site locally"
run = "zensical serve"

[tasks.lint]
description = "Run the linters"
depends = ["lint:*"]

[tasks."lint:editorconfig"]
description = "Lint files against .editorconfig"
run = "editorconfig-checker"

[tasks."lint:markdown"]
description = "Lint Markdown files"
run = "rumdl check --deny-config-warnings"

[tasks."lint:tofu"]
description = "Lint the OpenTofu files"
run = [
  # Check that files are formatted correctly:
  "tofu fmt -check -diff -recursive",
  # `tofu validate` requires the module to have been initialised, which it
  # won't be yet on fresh clones -- so do it!
  #
  # - `-backend=false` — this module has no backend.
  # - `-input=false` — headless initialisation.
  # - `-lockfile=readonly` — don't update `.terraform.lock.hcl`, and fail if
  #   providers were added or removed (other drift only warns).
  "tofu init -backend=false -input=false -lockfile=readonly",
  # Check that files describe valid infrastructure:
  "tofu validate",
]

[tasks."lint:toml"]
description = "Lint TOML files"
run = [
  "tombi lint --error-on-warnings .",
  "tombi format --check --diff .",
]

[tasks.test]
description = "Test the module, mostly with a mock provider"
# `tofu test` needs an initialised module, and `lint:tofu` initialises it.
depends = ["lint:tofu"]
run = "tofu test"

# Nothing updates these tools for us. Run `mise outdated --bump` now and then.
[tools]
editorconfig-checker = "4.0.2"  # Lint files against .editorconfig
opentofu = "1.13.9"             # Infrastructure as code
"pypi:zensical" = "0.1.1"       # Build the documentation site
python = "3.14.10"              # Run Zensical
rumdl = "0.2.77"                # Lint Markdown files
tombi = "1.5.5"                 # Lint TOML files
uv = "0.13.8"                   # Install Zensical from its locked dependencies
